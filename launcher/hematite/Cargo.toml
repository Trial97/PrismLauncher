
[package]
name = "hematite_static"
version = "0.1.0"
edition = "2021"
authors = [
    "Prism Launcher Contributors",
    "Rachel Powers <508861+Ryex@users.noreply.github.com>",
]
description = "A rust extension crate for Prism Launcher"
readme = "Readme.md"
homepage = "https://prismlauncher.org/"
repository = "https://github.com/PrismLauncher/PrismLauncher"
license-file = "../LICENSE"
links = "hematite_static"


[dependencies]
cxx = { version = "1.0.136", features = ["c++17", "std"] }
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", default-features = false, features = [
    # "qt_gui",
    "serde",
] }
indoc = "2.0.5"
serde = { version = "1.0", features = ["derive"] }
serde_ignored = "0.1.10"
serde_path_to_error = "0.1.16"
serde_with = "3.12.0"
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"


[build-dependencies]
cxx-qt-build = "0.7"
cxx-build = "1.0.136"

# [profile.release]
# # Tell `rustc` to optimize for small code size.
# opt-level = "s"
# lto = true
# [profile.dev]
# opt-level = 1

[lib]
crate-type = ["staticlib"]
